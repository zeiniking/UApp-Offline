
name: Build UApp APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'UApp_Android_Project.zip'
      - '.github/workflows/main.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check ZIP file
        run: |
          test -f UApp_Android_Project.zip
          unzip -l UApp_Android_Project.zip | head -40

      - name: Extract Android project
        run: |
          mkdir -p extracted
          unzip -q UApp_Android_Project.zip -d extracted
          find extracted -maxdepth 4 -type f | head -100

      - name: Locate Gradle project
        run: |
          PROJECT_DIR=$(find extracted -name settings.gradle -o -name settings.gradle.kts | head -1 | xargs -r dirname)
          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: ZIP mein Gradle Android project nahi mila."
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project found at: $PROJECT_DIR"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build debug APK
        run: |
          cd "$PROJECT_DIR"
          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew --no-daemon assembleDebug
          else
            echo "ERROR: Project mein gradlew wrapper nahi mila."
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: UApp-APK
          path: |
            extracted/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
        
