
name: Build UApp APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'UApp_Android_Project.zip'
      - '.github/workflows/**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          unzip UApp_Android_Project.zip -d .
          ls -la UApp_Android_Project

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle -p UApp_Android_Project assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: UApp-APK
          path: UApp_Android_Project/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
